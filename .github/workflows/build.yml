name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source (if app_source.zip is used)
        run: | if [ -f app_source.zip ]; then mkdir -p project unzip -q -o app_source.zip -d project echo "PROJECT_DIR=project" >> "$GITHUB_ENV" else echo "PROJECT_DIR=." >> "$GITHUB_ENV" fi 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" KhaderLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KhaderLauncher-apk
          path: KhaderLauncher.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: لانشر خضر - build ${{ github.run_number }}
          files: KhaderLauncher.apk
